<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Study, answer side</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ECECEE}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1E1E21; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.45; color: #ECECEE; padding: 54px 16px 34px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <a href="Deck.dc.html" aria-label="Close" style="width: 32px; height: 44px; display: flex; align-items: center; color: #8E8E93"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #8E8E93; font-variant-numeric: tabular-nums">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="#36363B" stroke-width="2.5"></circle><circle cx="10" cy="10" r="8" fill="none" stroke="{{accent}}" stroke-width="2.5" stroke-dasharray="50.3" stroke-dashoffset="34" transform="rotate(-90 10 10)"></circle></svg>
      <span><span style="color: #ECECEE">17</span> / 54</span>
    </span>
    <span style="width: 32px; text-align: right; color: #8E8E93; font-size: 18px">···</span>
  </div>
  <span style="font-size: 13px; color: #8E8E93">Words 1–500 · new word</span>

  <div style="background: #29292D; border: 1px solid #36363B; border-radius: 10px; padding: 36px 20px 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center">
    <span style="font-size: 40px; font-weight: 500; letter-spacing: -0.8px">achieve</span>
    <span style="height: 40px; border-radius: 20px; background: #1E1E21; border: 1px solid #36363B; display: flex; align-items: center; gap: 16px; padding: 0 16px; font-size: 12px; color: #8E8E93">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="#ECECEE"><path d="M7 4l13 8-13 8z"></path></svg>
      <span style="width: 64px; height: 3px; border-radius: 2px; background: #36363B; display: block"></span>
      <span>0.7×</span>
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ECECEE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>
    </span>
    <div style="width: 100%; border-top: 1px dashed #3E3E44"></div>
    <span style="font-size: 20px; color: {{accent}}">lograr</span>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
      <span style="font-size: 16px; color: #C9C9CE">You can <span style="color: #ECECEE; font-weight: 500">achieve</span> your goals.</span>
      <span style="display: flex; gap: 8px; font-size: 12px; color: #8E8E93">
        <span style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid #36363B">
          <svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="#8E8E93"><path d="M7 4l13 8-13 8z"></path></svg>Listen</span>
        <span style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid #36363B">
          <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>Repeat after it</span>
      </span>
    </div>
  </div>

  <div style="flex-grow: 1"></div>
  <div style="display: flex; align-items: flex-start; justify-content: space-between; padding: 0 8px">
    <span aria-label="Undo" style="width: 44px; height: 60px; display: flex; align-items: center; justify-content: center; color: #8E8E93"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path></svg></span>
    <div style="display: flex; gap: 20px">
      <a href="Reverse.dc.html" aria-label="Forgot, again in 1 minute" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 6px">
        <span style="width: 60px; height: 60px; border-radius: 30px; background: #29292D; border: 1px solid #36363B; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E07A7A" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></span>
        <span style="font-size: 11px; color: #8E8E93">1 min</span>
      </a>
      <a href="Done.dc.html" aria-label="Remembered, again in 3 days" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 6px">
        <span style="width: 60px; height: 60px; border-radius: 30px; background: #29292D; border: 1px solid #36363B; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7FC79A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
        <span style="font-size: 11px; color: #8E8E93">3 days</span>
      </a>
    </div>
    <span aria-label="More" style="width: 44px; height: 60px; display: flex; align-items: center; justify-content: center; color: #8E8E93; font-size: 18px">···</span>
  </div>
  <span style="text-align: center; font-size: 12px; color: #5E5E63">Swipe left = forgot · swipe right = remembered</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E5A54B","options":["#E5A54B","#6FBF9F","#7FA7E8","#D98AA8"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#E5A54B' };
}
}
</script>
</body>
</html>
