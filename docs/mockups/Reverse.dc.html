<html lang="en">
<head>

<title>Reverse card</title>

<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
body{margin:0}
a{color:#ECECEE}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1E1E21; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.45; color: #ECECEE; padding: 54px 16px 34px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">

    <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #8E8E93; font-variant-numeric: tabular-nums">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="#36363B" stroke-width="2.5"></circle><circle cx="10" cy="10" r="8" fill="none" stroke="{{accent}}" stroke-width="2.5" stroke-dasharray="50.3" stroke-dashoffset="33" transform="rotate(-90 10 10)"></circle></svg>
      <span><span style="color: #ECECEE">18</span> / 54</span>
    </span>
    <span style="width: 32px; text-align: right; color: #8E8E93; font-size: 18px">···</span>
  </div>
  <span style="font-size: 13px; color: #8E8E93">Words 1–500 · español → English</span>

  <a href="Answer.dc.html" aria-label="Reveal answer" style="text-decoration: none; background: #29292D; border: 1px solid #36363B; border-radius: 10px; padding: 56px 20px 48px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center">
    <span style="font-size: 13px; color: #8E8E93">How do you say it in English?</span>
    <span style="font-size: 36px; font-weight: 500; letter-spacing: -0.6px">mejorar</span>
    <span style="font-size: 16px; color: #C9C9CE">I want to <span style="display: inline-block; width: 72px; border-bottom: 1px solid {{accent}}"></span> my English.</span>
  </a>

  <span style="display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; color: #8E8E93; padding-top: 8px">Say it out loud, then tap to check</span>

  <div style="flex-grow: 1"></div>
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
    <span aria-label="Undo" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #8E8E93"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path></svg></span>

    <span aria-label="More" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #8E8E93; font-size: 18px">···</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E5A54B","options":["#E5A54B","#6FBF9F","#7FA7E8","#D98AA8"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#E5A54B' };
}
}
</script>
