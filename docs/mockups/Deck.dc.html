<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deck view</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ECECEE}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1E1E21; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.45; color: #ECECEE; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 54px 16px 0; display: flex; flex-direction: column; gap: 12px; flex-grow: 1; overflow: hidden">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
      <a href="Main.dc.html" aria-label="Back" style="width: 32px; height: 44px; display: flex; align-items: center; color: #8E8E93"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
      <span style="font-size: 16px; font-weight: 500">Words 1–500</span>
      <span style="width: 32px; text-align: right; color: #8E8E93; font-size: 18px">···</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="background: #29292D; border: 1px solid #36363B; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 500">231</span><span style="font-size: 12px; color: #8E8E93">learned</span></div>
      <div style="background: #29292D; border: 1px solid #36363B; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 500; color: {{accent}}">21</span><span style="font-size: 12px; color: #8E8E93">due today</span></div>
      <div style="background: #29292D; border: 1px solid #36363B; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 500">269</span><span style="font-size: 12px; color: #8E8E93">new</span></div>
    </div>

    <a href="Study.dc.html" style="text-decoration: none; height: 40px; border-radius: 8px; background: {{accent}}; color: #1E1E21; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">Study 21 due + 10 new</a>

    <div style="height: 36px; border-radius: 8px; background: #161618; border: 1px solid #36363B; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #8E8E93; font-size: 14px">
      <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      Search 500 words
    </div>

    <div style="display: flex; gap: 6px; font-size: 13px">
      <span style="padding: 4px 10px; border-radius: 6px; background: #36363B; color: #ECECEE">All</span>
      <span style="padding: 4px 10px; border-radius: 6px; color: #8E8E93">Due</span>
      <span style="padding: 4px 10px; border-radius: 6px; color: #8E8E93">Learning</span>
      <span style="padding: 4px 10px; border-radius: 6px; color: #8E8E93">Hard words</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{cards}}" as="c" hint-placeholder-count="8">
        <div style="background: #29292D; border: 1px solid #36363B; border-radius: 8px; padding: 14px 12px 10px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; justify-content: space-between; align-items: center">
            <span style="font-size: 18px; font-weight: 500">{{c.word}}</span>
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg>
          </div>
          <span style="font-size: 13px; color: #A9A9AF">{{c.meaning}}</span>
          <span style="font-size: 11px; color: {{c.color}}; border-top: 1px dashed #36363B; padding-top: 8px">{{c.state}}</span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E5A54B","options":["#E5A54B","#6FBF9F","#7FA7E8","#D98AA8"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#E5A54B';
const muted = '#8E8E93';
const cards = [
{ word: 'the', meaning: 'el, la, los, las', state: 'Next in 24 days', color: muted },
{ word: 'to', meaning: 'a, hacia; para', state: 'Next in 18 days', color: muted },
{ word: 'achieve', meaning: 'lograr', state: 'Due today', color: accent },
{ word: 'although', meaning: 'aunque', state: 'Hard · due today', color: '#E07A7A' },
{ word: 'improve', meaning: 'mejorar', state: 'Next in 3 days', color: muted },
{ word: 'enough', meaning: 'suficiente', state: 'Learning · 10 min', color: accent },
{ word: 'develop', meaning: 'desarrollar', state: 'New', color: muted },
{ word: 'support', meaning: 'apoyar; soporte', state: 'New', color: muted }
];
return { accent, cards };
}
}
</script>
</body>
</html>
