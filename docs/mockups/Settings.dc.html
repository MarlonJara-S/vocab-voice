<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ECECEE}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1E1E21; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.45; color: #ECECEE; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 54px 16px 0; display: flex; flex-direction: column; gap: 6px; flex-grow: 1">
    <div style="display: flex; align-items: center; height: 44px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.3px">Settings</h1>
    </div>

    <span style="font-size: 12px; font-weight: 500; letter-spacing: 0.3px; color: #8E8E93; padding: 12px 4px 2px">VOICE</span>
    <div style="background: #29292D; border: 1px solid #36363B; border-radius: 10px; display: flex; flex-direction: column">
      <div style="height: 44px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #36363B"><span>Voice</span><span style="font-size: 14px; color: #8E8E93">Samantha · US ›</span></div>
      <div style="height: 44px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #36363B; gap: 16px"><label for="speed">Speed</label><span style="display: flex; align-items: center; gap: 10px"><input id="speed" type="range" min="0.5" max="1.2" step="0.1" value="0.9" style="width: 120px; accent-color: {{accent}}"><span style="font-size: 14px; color: #8E8E93">0.9×</span></span></div>
      <div style="height: 44px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between"><label for="auto">Auto-play word</label><input id="auto" type="checkbox" checked style="width: 18px; height: 18px; accent-color: {{accent}}"></div>
    </div>
    <span style="font-size: 12px; color: #8E8E93; padding: 4px 4px 0">Tip: download “Enhanced” voices in iPhone Settings › Accessibility › Spoken Content.</span>

    <span style="font-size: 12px; font-weight: 500; letter-spacing: 0.3px; color: #8E8E93; padding: 16px 4px 2px">STUDY</span>
    <div style="background: #29292D; border: 1px solid #36363B; border-radius: 10px; display: flex; flex-direction: column">
      <div style="height: 44px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #36363B"><span>New cards per day</span><span style="font-size: 14px; color: #8E8E93">20 ›</span></div>
      <div style="height: 44px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #36363B"><span>Target memory</span><span style="font-size: 14px; color: #8E8E93">90% ›</span></div>
      <div style="height: 44px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between"><label for="rev">Reverse cards (ES → EN)</label><input id="rev" type="checkbox" checked style="width: 18px; height: 18px; accent-color: {{accent}}"></div>
    </div>

    <span style="font-size: 12px; font-weight: 500; letter-spacing: 0.3px; color: #8E8E93; padding: 16px 4px 2px">DATA</span>
    <div style="background: #29292D; border: 1px solid #36363B; border-radius: 10px; display: flex; flex-direction: column">
      <div style="height: 44px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #36363B"><span>Export backup</span><span style="font-size: 14px; color: #8E8E93">3 days ago</span></div>
      <div style="height: 44px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between"><span>Import CSV or backup</span><span style="font-size: 14px; color: #8E8E93">›</span></div>
    </div>
  </div>

  <nav style="height: 82px; box-sizing: border-box; padding: 10px 24px 0; background: #26262A; border-top: 1px solid #36363B; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Main.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8E8E93; font-size: 11px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Today</a>
    <a href="Deck.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8E8E93; font-size: 11px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="13" rx="2"></rect><path d="M7 4h10"></path></svg>Decks</a>
    <a href="Done.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8E8E93; font-size: 11px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"></path></svg>Stats</a>
    <a href="Settings.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: {{accent}}; font-size: 11px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg>Settings</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E5A54B","options":["#E5A54B","#6FBF9F","#7FA7E8","#D98AA8"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#E5A54B' };
}
}
</script>
</body>
</html>
